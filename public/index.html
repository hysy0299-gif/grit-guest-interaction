  /* one line of guidance, bottom left, in the deck's asymmetric margin */
  #guide {
    position:fixed; left:68px; bottom:38px;
    font:700 11px/1.7 "HN", "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing:.12em;
    color:#010101; opacity:.55;
    white-space:pre-line; pointer-events:none;
    transition:opacity .4s;
  }
  #guide:empty { opacity:0; }

  /* the capture rule, right above the camera. Always up while the
     camera is live, because it is the one thing nobody guesses. */
  #capnote {
    position:fixed; right:0; bottom:270px; width:360px;
    padding:0 0 8px 0;
    font:700 13px/1.5 "HN", "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing:.1em; text-align:center;
    color:#010101; opacity:0; transition:opacity .4s;
    pointer-events:none;
  }
  body.cam #capnote { opacity:.55; }

  /* the note: exists only between the capture and the hold going up */
  #note {
    position:fixed; left:68px; bottom:76px;
    display:flex; flex-direction:column; gap:14px;
    font:700 12px/1.4 "HN", "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing:.12em;
  }
  #note[hidden] { display:none; }
  #note input {
    width:340px; padding:6px 0;
    border:0; border-bottom:1px solid #010101;
    background:transparent; outline:none;
    font:inherit; letter-spacing:inherit; color:#010101; text-transform:uppercase;
  }
  #note input::placeholder { color:#010101; opacity:.32; }
  #noteRow { display:flex; gap:22px; align-items:baseline; }
  #archive, #retake {
    align-self:start;
    padding:0; border:0; background:none;
    font:inherit; letter-spacing:inherit; color:#010101; opacity:.55;
    text-decoration:underline; text-underline-offset:4px;
    cursor:pointer;
  }
  #archive { opacity:1; }
  #archive[disabled] { opacity:.35; cursor:default; }
  #retake:hover, #retake:focus-visible, #archive:hover, #archive:focus-visible { opacity:1; outline:none; }

  /* the way in to what has been kept, set like the guide below it */
  #toWall {
    position:fixed; left:68px; top:38px;
    font:700 11px/1.7 "HN", "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing:.12em;
    color:#010101; opacity:.55;
    background:none; border:0; padding:0;
    cursor:pointer; z-index:3;
  }
  #toWall:hover, #toWall:focus-visible { opacity:1; outline:none; }
  body.wall #toWall { opacity:1; }

  /* the wall: what the room sees when nobody is making anything */
  #wall {
    position:fixed; inset:0;
    --dot:96px;
    background-color:#F5F5F5;   /* opaque, or the live field shows through the grid */
    background-image:radial-gradient(circle at center, rgba(1,1,1,.5) 1.1px, transparent 1.6px);
    background-size:var(--dot) var(--dot);
    display:grid;
    grid-template-columns:repeat(auto-fill, var(--dot));
    grid-auto-rows:var(--dot);
    padding:var(--dot) 0 0 var(--dot);
    align-content:start; justify-content:start;
    opacity:1; transition:opacity .6s;
    pointer-events:none;
  }
  #wall {
    opacity:0; visibility:hidden;
    transition:opacity .9s ease, visibility 0s .9s;
  }
  body.wall #wall { pointer-events:auto; }
  body.wall #wall {
    opacity:1; visibility:visible;
    transition:opacity .9s ease;
  }

  /* the field steps back while the wall is up */
  #field, #guide, #camview { transition:opacity .9s ease; }
  body.wall #field, body.wall #guide,
  body.wall #camview, body.wall #capnote { opacity:0; }

  /* the one just added arrives a beat later than the rest */
  /* the crop, drawn where bake() actually cuts */
  #frame {
    position:fixed; left:50%; top:50%; transform:translate(-50%, -50%);
    border:1px solid #010101;
    opacity:0; transition:opacity .25s;
    pointer-events:none;
  }
  #count {
    position:absolute; left:10px; top:10px;
    font:700 11px/1 "HN", "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing:.12em; color:#010101;
  }

  #wall figure.fresh { animation:land .5s ease both; }
  @keyframes land { from { opacity:0; } to { opacity:1; } }
  #wall figure {
    margin:0; display:grid; place-items:center;
  }
  body.wall #wall figure { cursor:pointer; }
  body.wall #wall figure img { transition:opacity .2s; }
  body.wall #wall figure:hover img { opacity:.5; }

  /* one hold, opened: a card over the wall */
  #detail {
    position:fixed; inset:0; z-index:4;
    display:flex; align-items:center; justify-content:center;
    background:rgba(245,245,245,.82);
    opacity:0; visibility:hidden;
    transition:opacity .3s ease, visibility 0s .3s;
  }
  body.detail #detail {

  #pager button:hover:not([disabled]) { opacity:1; }

  #wall img { display:block; width:72%; aspect-ratio:1; object-fit:contain; }

<script type="module">
// Loaded only after a camera opens. Nothing is fetched on a machine
// without one, and a CDN that is down costs the hand tracking, not the
// page. Vendor these into exhibition/vendor/ before the show.
const VISION = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21";
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

/* ------------------------------------------------------------------
   MG-N01-S04 — magnetic axis, speculative.

   On GRIT WHITE the field reads as a density record, not a light
   source: the shader accumulation is inverted, so mass darkens the
   paper through GREEN -> MID -> BLACK instead of glowing.

   IDLE -> PROXIMITY -> CONTACT -> RESIDUE -> RESET
------------------------------------------------------------------- */

const VERT = `#version 300 es
precision highp float;
layout(location=0) in vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const FRAG = `#version 300 es
precision highp float;

out vec4 fragColor;

uniform vec3  iResolution;
uniform float iTime;
uniform vec2  uRot;        // final ray rotation (idle drift blended with pointer)
uniform vec2  uPointPx;    // pointer in framebuffer px, origin bottom-left
uniform vec2  uAnchorPx;   // last contact point, for the residue ring
uniform float uProx;       // 0..1 approach
uniform float uContact;    // 0..1 contact
uniform float uResidue;    // 0..1 decaying trace
uniform float uEnergy;     // 0..1 pointer speed
uniform float uHold;       // 0..1 scroll progress
uniform vec3  uSeed;       // this visitor's hold: lobes, axis, surface
uniform float uSize;       // 0..1, how much material ends up in it
uniform vec4  uSeed2;      // -1..1 each: lobe scale, shell stretch, twin amount, twin angle
uniform sampler2D uProfile; // 256 x 17, R8: a hold's reach by angle, x2.5
uniform vec4  uForm;       // hold A row, hold B row, blend (sign = mirrored), turn
uniform float uFit;        // 1 / this hold's furthest reach, so all holds fill the same circle
uniform sampler2D uRelief; // 64 x 1088, R8: light and dark inside each hold, 0.5 = flat
uniform vec4  uTuneA;      // gathered: exposure, fold lo, fold hi, churn left
uniform vec4  uTuneB;      // gathered: radius scale, y squash, z squash, -
uniform vec4  uTuneC;      // gathered: photo relief depth, edge rounding, -, -

mat2 rot(float a){ float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }

float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

// The outline of a real hold, read as reach against angle. Two of the
// archive's 17 blended, turned, sometimes mirrored. Always inside the
// family — it cannot produce a shape the archive does not have.
float silhouette(float th){
  float s = uForm.z < 0.0 ? -1.0 : 1.0;
  float u = (s * th + uForm.w) / 6.28318530;
  float a = texture(uProfile, vec2(u, (uForm.x + 0.5) / 17.0)).r * 2.5;
  float b = texture(uProfile, vec2(u, (uForm.y + 0.5) / 17.0)).r * 2.5;
  return mix(a, b, abs(uForm.z));
}

// The photo's own shading inside the outline: what caught the key light
// is raised, what did not is hollow. High-passed, so a black hold and a
// white one give the same kind of relief.
float reliefAt(float row, float phi, float rn){
  vec2 uv = clamp(vec2(0.5 + 0.5 * rn * cos(phi), 0.5 - 0.5 * rn * sin(phi)), 0.02, 0.98);
  return texture(uRelief, vec2(uv.x, (row + uv.y) / 17.0)).r;
}
float relief(float th, float rn){
  float s = uForm.z < 0.0 ? -1.0 : 1.0;
  float phi = s * th + uForm.w;
  return mix(reliefAt(uForm.x, phi, rn), reliefAt(uForm.y, phi, rn), abs(uForm.z));
}

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
  vec2  r  = iResolution.xy;
  float t  = iTime;
  vec3  FC = vec3(fragCoord, t);
  vec4  o  = vec4(0.0);

  vec3 p, a;
  float z = 0.0;
  float d = 0.0;

  // frame width. Higher = wider view = the mass sits smaller in frame.
  float h0  = smoothstep(0.02, 0.98, uHold);
  float FOV = mix(2.10, uTuneC.z, h0);

  vec3 rd = FC.rgb * 2.0 - r.xyy;
  rd.xy *= FOV;
  vec3 dir = normalize(rd);
  dir.xz *= rot(uRot.x);
  dir.yz *= rot(uRot.y);

  float h     = smoothstep(0.02, 0.98, uHold);
  float pull  = uContact * 2.0 + uResidue * 0.55;

  // the extent is what makes the gathering readable: loose material spans
  // most of the frame, the packed mass is about a third of it
  // the left hand's pinch decides how much material the hold keeps
  // FIT sets the margin once it has gathered: the furthest point of any
  // hold, at default size, sits at packed * FIT from the centre
  const float FIT = 0.75;
  float packed = mix(2.05, 3.60, uSize) * uTuneB.x;
  // the fit wraps the contact and residue terms too. Added after it,
  // they were multiplied back up by each hold's reach, and the long
  // holds came out a third larger than the round ones.
  float loose  = 6.6    + uContact * 1.15 + uResidue * 0.30;
  // the pinch also moves the whole body toward and away from the camera,
  // which is what actually reads as size — the shell radius alone barely does
  float gather = (packed + uContact * 1.15 + uResidue * 0.30) * uFit * FIT
                 * mix(0.66, 1.24, uSize);
  float radius = mix(loose, gather, h);
  // the churn has to die down as it sets, or it never reads as a thing
  float agit  = (uEnergy * 2.2 + uResidue * 0.9 + uProx * 0.5) * mix(1.0, uTuneA.w, h);

  // --- SEED. The archive's own seventeen set the range, nothing wider:
  // one to four rounded lobes, a single dominant axis, one surface
  // feature, and a back that flattens because it mounts to a wall.

  // where the lobes sit. This is the whole silhouette — CLOVER's four
  // arms and KNOT's two crossing lumps differ only here.
  vec3 axis = vec3(4.0, 2.0, 0.0) + uSeed.x * vec3(2.7, 1.9, 3.3);

  // scaling a coordinate up compresses the mass along it. Negative seed
  // runs it long like SPROUT, positive runs it flat and wide like RAY.
  float stretchX = mix(1.0, 1.0  + max(-uSeed.y, 0.0) * 0.55, h);
  float stretchY = mix(1.0, uTuneB.y + max( uSeed.y, 0.0) * 0.42, h);

  // this is what does the gathering. Over 1.0 the folding overwhelms the
  // shell and it breaks into separate scattered lobes; dropping toward 0.2
  // merges them into one mass, with just enough relief left to read as a hold.
  // VEIL and CUSHION settle almost smooth; CRUMPLE, WHORL and RIPPLE
  // keep their relief. Above 0.4 it stops reading as one hold.
  float fold  = mix(1.62, mix(uTuneA.y, uTuneA.z, uSeed.z), h);

  // --- the rest of the seed. Zero on every axis is the look that was
  // signed off; these only push away from it, and only so far.

  // which scale of lobe carries the fold. Positive moves weight into the
  // middle harmonics (a few clear lobes, CLOVER / FIN); negative leaves
  // one big body with fine relief on it (VEIL / CRUMPLE).
  vec4 wk = vec4(1.0) + uSeed2.x * vec4(-0.55, 0.95, 0.95, -0.55);

  // the shell itself stretched, on top of the frame squash. This is what
  // separates SPROUT from BUBBLE more than anything else does.
  vec3 an = vec3(1.0) + vec3(uSeed2.y, -uSeed2.y, 0.0) * 0.38;

  // a second, smaller shell alongside the first. KNOT, BUBBLE, MELT are
  // all two bodies that never quite merged. Off below |0.35|.
  float twin = smoothstep(0.35, 0.90, abs(uSeed2.z));
  vec3  toff = vec3(cos(uSeed2.w * 3.14159), sin(uSeed2.w * 3.14159), 0.0) * sign(uSeed2.z);

  for (float i = 0.0; i < 100.0; i++)
  {
    p = z * dir;
    a = normalize(cos(axis + t - d * 10.0 + agit));
    p.z += 8.0 - pull;
    p.x *= stretchX;
    p.y *= stretchY;            // settles wider than tall
    // and gathers into the outline of a real hold. Same warp as the
    // stretch above, just shaped by the archive instead of an ellipse.
    float tone = 1.0;
    {
      float th  = atan(p.y, p.x);
      float sil = silhouette(th);
      // how far out toward the outline this point sits: 0 centre, 1 edge
      float rn  = length(p.xy) / max(radius * sil, 1e-3);
      p.xy /= mix(1.0, sil, h);
      // the surface follows the photo's light and dark
      float rel = relief(th, rn) - 0.5;
      p.z += rel * uTuneC.x * 0.4 * h;
      // what caught the light takes less ink, hollows take more, and the
      // body darkens toward its edge where it turns away
      tone = mix(1.0, (1.0 - rel * 2.0 * uTuneC.x) * (1.0 + smoothstep(0.6, 1.0, rn) * 0.45), h);
      // and the back rounds off toward the edge — cast, not stamped
      p.z *= mix(1.0, 1.0 + smoothstep(0.45, 1.05, rn) * uTuneC.y, h);
    }
    p.z *= mix(1.0, uTuneB.z, h);   // and shallower, so it sits like relief
    a = a * dot(a, p) - cross(a, p);
    for (float k = 1.0; k < 5.0; k += 1.0) {
      float w = k < 1.5 ? wk.x : k < 2.5 ? wk.y : k < 3.5 ? wk.z : wk.w;
      a += sin(a * k + t + agit * 0.8).yzx / k * fold * w;
    }
    d = abs(length(a * an) - radius) / 6.0;
    if (twin > 0.0) {
      float d2 = abs(length((a - toff * radius * 0.55) * an) - radius * 0.72) / 6.0;
      d = mix(d, min(d, d2), twin);
    }
    z += d;
    o += vec4(3.0, 8.0, z, 0.0) / max(d, 1e-4) / 9e4 * tone;
  }

  // --- GRIT COLOR
  vec3 WHITE = vec3(0.961, 0.961, 0.961);
  vec3 BLACK = vec3(0.004, 0.004, 0.004);
  vec3 MID   = vec3(0.682, 0.714, 0.749);
  vec3 GREEN = vec3(0.796, 0.843, 0.831);

  // density, not luminance: the accumulation is inverted onto paper
  float e = o.r * 0.34 + o.g * 0.50 + o.b * 0.16;
  e = 1.0 - exp(-e * mix(1.32, uTuneA.x, h));   // thin and dusty up top, solid at the end

  // The march leaves a faint accumulation on every pixel it passes
  // through, including the empty ones. Cut it away, or the whole sheet
  // tints and there is no white left for the hold to sit on.
  e = max(0.0, e - 0.12);

  vec3 col = mix(WHITE, GREEN, smoothstep(0.00, 0.16, e));
  col = mix(col, MID,   smoothstep(0.14, 0.46, e));
  col = mix(col, BLACK, smoothstep(0.44, 0.86, e));

  // grain only where there is material. On bare paper it would be the
  // one thing keeping the ground from being exactly GRIT WHITE.
  col += (hash21(fragCoord + fract(t) * 91.7) - 0.5) * 0.011 * smoothstep(0.0, 0.04, e);

  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}

void main(){ mainImage(fragColor, gl_FragCoord.xy); }
`;

  const uRes = U("iResolution"), uTime = U("iTime"), uRot = U("uRot"),
        uPointPx = U("uPointPx"), uAnchorPx = U("uAnchorPx"),
        uProx = U("uProx"), uContact = U("uContact"),
        uResidue = U("uResidue"), uEnergy = U("uEnergy"),
        uHold = U("uHold"), uSeed = U("uSeed"), uSize = U("uSize"),
        uTuneA = U("uTuneA"), uTuneB = U("uTuneB"), uSeed2 = U("uSeed2"),
        uProfile = U("uProfile"), uForm = U("uForm"), uRelief = U("uRelief"), uTuneC = U("uTuneC"),
        uFit = U("uFit");

  // the archive's outlines: one row per hold, angle across, wrapping
  {
    const u8 = new Uint8Array(256 * PROFILES.length);
    PROFILES.forEach((row, r) => row.forEach((v, i) => { u8[r * 256 + i] = Math.round(Math.min(1, v / 2.5) * 255); }));
    const tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 256, PROFILES.length, 0, gl.RED, gl.UNSIGNED_BYTE, u8);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.uniform1i(uProfile, 0);

    const rel = Uint8Array.from(atob(RELIEF.data), c => c.charCodeAt(0));
    const rtex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, rtex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, RELIEF.size, RELIEF.size * RELIEF.rows, 0, gl.RED, gl.UNSIGNED_BYTE, rel);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.uniform1i(uRelief, 1);
    gl.activeTexture(gl.TEXTURE0);
  }


  // ---- state -------------------------------------------------------
  let ftime = 0;

  const S = {
    nx:0, ny:0, tnx:0, tny:0,           // pointer, field-normalized (-1..1)
    px:0, py:0, tpx:0, tpy:0,           // pointer, css px, field-local, y up
    ax:0, ay:0,                         // residue anchor
    prox:0, tprox:0,
    contact:0, tcontact:0,
    residue:0,
    energy:0,
    down:0, hold:0,
    seed:[0, 0, 0], seed2:[0, 0, 0, 0], form:[0, 1, 0, 0], pick:-1, armed:true, size:0.5,
    fixed:false, settleT:0, stillT:0, phase:"MAKE", baked:null, bakedUrl:null, bakeReady:null,
    wasHold:0, wasSize:0.5, wasForm:-1,
    lastX:0, lastY:0, seen:false,
    lastInput: performance.now(),
    label:"IDLE"
  };

  // One hold per visitor. Rolled when the field goes from empty to
  // occupied, never while a mass is still on screen — nobody watches
  // their own hold change shape under them.
  function rollSeed(){
    S.seed[0] = Math.random();
    S.seed[1] = 0;   // ellipse stretch retired: the outline owns the shape
    S.seed[2] = Math.random();
    // the outline carries the variety now; keep these mild, twin off
    for (let i = 0; i < 4; i++) S.seed2[i] = (Math.random() * 2 - 1) * 0.3;
    // one hold per visitor, from the pool, turned, half the time mirrored
    S.pick = POOL[Math.floor(Math.random() * POOL.length)];
    S.form[0] = S.pick; S.form[1] = S.pick;
    S.form[2] = Math.random() < 0.5 ? -0.0001 : 0.0001;    // sign is the mirror, no blend
    S.form[3] = 0;   // upright, the way the archive photographs them


    if (DEV_PICK) {
      const i = Math.max(0, HOLD_NAMES.indexOf(DEV_PICK.toUpperCase()));
      S.form[0] = i; S.form[1] = i; S.form[2] = 0; S.form[3] = DEV_ROT;
    }
  }
  rollSeed();

  // radial bands, in units of frame height, measured from the centre
  const R_PROX = 0.80, R_CONTACT = 0.42, R_CORE = 0.20;

  const smoothstep = (a, b, x) => {
    const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };

  function onPointer(e){
    if (Sense.on) return;          // the camera has the floor
    const r = fieldEl.getBoundingClientRect();
    const x = e.clientX - r.left;
    const y = e.clientY - r.top;

    const rd = Math.hypot(x - r.width / 2, y - r.height / 2) / r.height;
    S.tprox    = 1 - smoothstep(R_CONTACT, R_PROX,    rd);
    S.tcontact = 1 - smoothstep(R_CORE,    R_CONTACT, rd);
    const inside = rd < R_CONTACT;

    if (S.seen) {
      const sp = Math.hypot(x - S.lastX, y - S.lastY) / Math.max(1, r.height);
      S.energy = Math.min(1, S.energy + sp * 3.0);
    }
    S.lastX = x; S.lastY = y; S.seen = true;
    S.lastInput = performance.now();

    S.tnx = (x / r.width)  * 2 - 1;
    S.tny = (y / r.height) * 2 - 1;
    S.tpx = x;
    S.tpy = r.height - y;

    if (inside) { S.ax = S.tpx; S.ay = S.tpy; S.residue = Math.max(S.residue, 0.85); }
    if (EXHIBITION) document.body.classList.remove("dim");
  }

  window.addEventListener("pointermove", onPointer, { passive:true });
  window.addEventListener("pointerdown", (e) => {
    onPointer(e); S.residue = 1;
    if (e.button === 0) S.down = 1;     // hold to gather
  }, { passive:true });
  window.addEventListener("pointerup",     () => { S.down = 0; });
  window.addEventListener("pointercancel", () => { S.down = 0; });
  window.addEventListener("pointerleave", () => {
    S.tprox = 0; S.tcontact = 0; S.tnx = 0; S.tny = 0; S.down = 0;
  });
  canvas.addEventListener("contextmenu", e => e.preventDefault());

  // wheel does the left hand's job, R brings the next visitor
  addEventListener("wheel", e => {
    if (Sense.on || S.fixed) return;
    S.size = Math.min(1, Math.max(0, S.size - e.deltaY * 0.0015));
  }, { passive:true });

  addEventListener("keydown", e => {
    if (Sense.on || S.fixed) return;
    if (e.key === "r" || e.key === "R" || e.key === " ") { e.preventDefault(); rollSeed(); }
  });

  // ---- hands -------------------------------------------------------
  // MediaPipe HandLandmarker: 21 joints per hand, up to two, each with a
  // left/right label. Every reading below is a joint distance divided by
  // the hand's own width, so none of it shifts when the visitor stands
  // closer to or further from the camera — only the gesture moves it.
  //
  //   grip    right hand, fingertips drawn toward the palm  -> gathering
  //   pinch   left hand, thumb tip to index tip             -> size
  //   x, y    right hand centre, mirrored to match the room
  //   energy  how fast that hand is travelling
  //
  // The labels come back assuming a mirrored image. If the two hands
  // turn out swapped in the room, flip this and nothing else.
  let handSwap = false;
  try { handSwap = localStorage.getItem("grit-hand-swap") === "1"; } catch (e) {}

  // measured in hand widths (wrist to middle knuckle), so they hold at
  // any distance. Read the live numbers off the D overlay to retune.
  const GRIP_OPEN  = 1.48, GRIP_SHUT = 1.00;
  const PINCH_SHUT = 0.34, PINCH_OPEN = 1.15;

  const Sense = {
    on:false, denied:false, note:"OPENING CAMERA",
    grip:0, pinch:0.5, x:0.5, y:0.5, energy:0, present:0,
    lastX:0.5, lastY:0.5, seen:false, lastFrame:-1,
    hands:[], twist:0, rolls:{}
  };

  const camEl = document.getElementById("cam");
  const dbgEl = document.getElementById("camview");
  const DW = 360, DH = 270;
  const dbgCtx = dbgEl.getContext("2d");

  let landmarker = null;

  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
  const norm = (v, lo, hi) => Math.min(1, Math.max(0, (v - lo) / (hi - lo)));

  // wrist to middle knuckle. The one length on a hand that barely moves
  // whatever the fingers are doing, so it is the unit for everything else.
  const handWidth = L => Math.max(1e-4, dist(L[0], L[9]));

  // open hand holds its fingertips about two hand widths from the wrist;
  // a closed fist brings them to roughly one
  function gripOf(L){
    const w = handWidth(L);
    const reach = (dist(L[8], L[0]) + dist(L[12], L[0]) + dist(L[16], L[0]) + dist(L[20], L[0])) / (4 * w);
    // pull the ends out so a flat hand reads as 0 and a fist as 1,
    // instead of both stopping short
    const t = norm(reach, GRIP_SHUT, GRIP_OPEN);
    return 1 - norm(t, 0.06, 0.80);
  }

  const pinchOf = L => norm(norm(dist(L[4], L[8]) / handWidth(L), PINCH_SHUT, PINCH_OPEN), 0.08, 0.92);

  async function startHands(){
    if (new URLSearchParams(location.search).has("mouse")) {
      Sense.denied = true; Sense.note = "POINTER"; return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      Sense.denied = true; Sense.note = "NO CAMERA API"; return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{ width:640, height:480, facingMode:"user" }, audio:false
      });
      camEl.srcObject = stream;
      await camEl.play();
      document.body.classList.add("cam");
    } catch (err) {
      Sense.denied = true; Sense.note = "NO CAMERA / " + err.name;
      console.warn("camera unavailable, pointer fallback:", err.name);
      return;
    }
    let fileset, FilesetResolver, HandLandmarker;
    try {
      Sense.note = "LOADING RUNTIME";
      ({ FilesetResolver, HandLandmarker } = await import(VISION + "/vision_bundle.mjs"));
      fileset = await FilesetResolver.forVisionTasks(VISION + "/wasm");
    } catch (err) {
      Sense.denied = true;
      Sense.note = "WASM FAILED / " + String(err && err.message || err).slice(0, 40);
      console.error("hand runtime failed:", err);
      return;
    }

    // the page already holds a WebGL2 context of its own, and the GPU
    // delegate does not always survive sharing a machine with it. CPU is
    // slower but it is the difference between working and not.
    Sense.note = "LOADING MODEL";
    for (const delegate of ["GPU", "CPU"]) {
      try {
        landmarker = await HandLandmarker.createFromOptions(fileset, {
          baseOptions:{ modelAssetPath: MODEL_URL, delegate },
          numHands: 2,
          runningMode: "VIDEO"
        });
        Sense.on = true;
        document.body.classList.add("cam");
        console.info("hand model running on", delegate);
        return;
      } catch (err) {
        Sense.note = delegate + " FAILED / " + String(err && err.message || err).slice(0, 40);
        console.error("hand model failed on", delegate, err);
      }
    }
    Sense.denied = true;
  }
  startHands();

  const DIFF_FLOOR = 0;      // kept out of the way; nothing reads it now
  let tune = false;
  document.body.classList.toggle("tune", tune);

  addEventListener("keydown", e => {
    if (S.phase === "NOTE") return;
    if (e.key === "h" || e.key === "H") {
      handSwap = !handSwap;
      try { localStorage.setItem("grit-hand-swap", handSwap ? "1" : "0"); } catch (err) {}
      guideEl.textContent = handSwap ? "HANDS SWAPPED" : "HANDS NORMAL";
      lastGuide = null;
      return;
    }
    if (e.key === "d" || e.key === "D") {
      tune = !tune;
      document.body.classList.toggle("tune", tune);
    }
  });

  // the overlay has to say which of the several ways this can fail
  // happened, or a blocked camera and a broken page look the same.
  // Tuning overlay only — it never reaches the exhibition screen.
  // ---- knobs for the gathered state ---------------------------------
  // Turned from the keyboard with the D overlay up, kept in localStorage.
  // Once a set reads right, its numbers go into the shader as defaults.
  //   1-7 pick a knob · ↑↓ nudge (shift ×5) · 0 puts everything back
  const KNOBS = [
    ["expo",   2.20, 0.10, "exposure at full hold. up = solid"],
    ["foldLo", 0.05, 0.01, "relief, smooth end of the seed"],
    ["foldHi", 0.22, 0.01, "relief, rough end of the seed"],
    ["agit",   0.15, 0.05, "churn left once it has set"],
    ["radius", 1.00, 0.05, "size of the set mass"],
    ["py",     1.12, 0.02, "flattened top to bottom"],
    ["pz",     1.22, 0.02, "flattened front to back. relief"],
    ["relief", 0.45, 0.05, "the photo's light and dark, as ink"],
    ["dome",   0.35, 0.05, "back rounds off toward the edge"],
    ["zoom",   1.10, 0.05, "view width once gathered. down = closer"]
  ];
  // per-hold values from the tuning pass. What the visitor changes is
  // size and angle; none of this.
  const HOLD_TUNE = {
    "BUBBLE": {"expo":1.6,"foldLo":-0.1,"foldHi":0.02,"agit":0.4,"radius":1,"py":1.22,"pz":1.22,"relief":-0.05,"dome":0.1,"zoom":1.1},
    "CHALK": {"expo":2.2,"foldLo":0.05,"foldHi":-0.08,"agit":0.4,"radius":1,"py":1.22,"pz":1.22,"relief":-0.8,"dome":0.35,"zoom":1.1},
    "CLOVER": {"expo":2.7,"foldLo":-0.75,"foldHi":0.42,"agit":-3.6,"radius":1,"py":1.22,"pz":1.42,"relief":0.2,"dome":0.35,"zoom":1.1},
    "CRUMPLE": {"expo":2.3,"foldLo":-0.05,"foldHi":0.22,"agit":-0.1,"radius":1,"py":1.22,"pz":1.22,"relief":0.2,"dome":0.35,"zoom":1.1},
    "CUSHION": {"expo":0.7,"foldLo":-0.67,"foldHi":0.46,"agit":0.75,"radius":1,"py":1.12,"pz":1.32,"relief":-0.05,"dome":0.1,"zoom":1.1},
    "FIN": {"expo":2.2,"foldLo":0.25,"foldHi":0.07,"agit":-4.1,"radius":1,"py":0.92,"pz":1.22,"relief":-0.8,"dome":0.35,"zoom":1.1},
    "GLIDER": {"expo":4.7,"foldLo":-0.15,"foldHi":-0.13,"agit":-0.1,"radius":1,"py":1.12,"pz":1.12,"relief":0.45,"dome":0.35,"zoom":1.1},
    "KNOT": {"expo":2.7,"foldLo":0.15,"foldHi":0.22,"agit":0.15,"radius":1,"py":1.12,"pz":1.22,"relief":0.45,"dome":0.35,"zoom":1.1},
    "MELT": {"expo":2.2,"foldLo":0.05,"foldHi":0.22,"agit":0.15,"radius":1,"py":1.12,"pz":1.22,"relief":0.45,"dome":0.35,"zoom":1.1},
    "RAY": {"expo":2.7,"foldLo":-0.05,"foldHi":0.17,"agit":0.15,"radius":1,"py":1.12,"pz":1.32,"relief":0.95,"dome":0.35,"zoom":1.1},
    "RIPPLE": {"expo":1.2,"foldLo":0,"foldHi":0.22,"agit":-0.1,"radius":1,"py":1.02,"pz":1.42,"relief":0.45,"dome":0.35,"zoom":1.1},
    "SHELL": {"expo":2.2,"foldLo":0.05,"foldHi":0.22,"agit":0.15,"radius":1,"py":1.12,"pz":1.22,"relief":0.45,"dome":0.35,"zoom":1.1},
    "SLOPE": {"expo":5.2,"foldLo":0.05,"foldHi":0.02,"agit":-0.1,"radius":1,"py":0.92,"pz":1.32,"relief":-0.55,"dome":0.35,"zoom":1.1},
    "SPROUT": {"expo":2.2,"foldLo":0.05,"foldHi":0.22,"agit":0.15,"radius":1,"py":1.12,"pz":1.22,"relief":0.45,"dome":0.35,"zoom":1.1},
    "VALLEY": {"expo":2.2,"foldLo":0.05,"foldHi":0.22,"agit":0.15,"radius":1,"py":1.12,"pz":1.22,"relief":0.45,"dome":0.35,"zoom":1.1},
    "VEIL": {"expo":2.2,"foldLo":0.05,"foldHi":0.22,"agit":0.15,"radius":1,"py":1.12,"pz":1.22,"relief":0.45,"dome":0.35,"zoom":1.1},
    "WHORL": {"expo":2.2,"foldLo":0.05,"foldHi":0.22,"agit":0.15,"radius":1,"py":1.12,"pz":1.22,"relief":0.45,"dome":0.35,"zoom":1.1}
  };
  let TUNES = {};
  try { TUNES = JSON.parse(localStorage.getItem("grit-tune-holds-2") || "{}"); } catch (e) {}
  function tuneFor(i){
    if (!TUNES[i]) {
      TUNES[i] = {};
      for (const [k, v] of KNOBS) TUNES[i][k] = (HOLD_TUNE[HOLD_NAMES[i]] || {})[k] ?? v;
    }
    return TUNES[i];
  }
  let T = tuneFor(0);
  let knob = 0;

  addEventListener("keydown", e => {
    if (!tune || S.phase === "NOTE") return;
    const d = e.key === "ArrowUp" ? 1 : e.key === "ArrowDown" ? -1 : 0;
    if (d) {
      e.preventDefault();
      const [k, , step] = KNOBS[knob];
      T[k] = Math.round((T[k] + d * step * (e.shiftKey ? 5 : 1)) * 1000) / 1000;
    } else if (e.key >= "0" && e.key <= "9") {
      knob = (e.key === "0" ? 10 : Number(e.key)) - 1;
      if (knob >= KNOBS.length) return;
    } else if (e.key === "Backspace") {
      for (const [k, v] of KNOBS) T[k] = v;
    } else return;
    try { localStorage.setItem("grit-tune-holds-2", JSON.stringify(TUNES)); } catch (err) {}
  });

  const dumpEl = document.getElementById("dump");
  addEventListener("keydown", e => {
    if (S.phase === "NOTE") return;
    if (e.target === dumpEl) { if (e.key === "Escape") { dumpEl.hidden = true; canvas.focus(); } return; }
    if (e.key !== "e" && e.key !== "E") return;
    if (!dumpEl.hidden) { dumpEl.hidden = true; return; }
    const out = {};
    for (const i in TUNES) out[HOLD_NAMES[i] || i] = TUNES[i];
    const json = JSON.stringify(out, null, 1);
    console.log(json);
    if (navigator.clipboard) navigator.clipboard.writeText(json).catch(() => {});
    dumpEl.value = json;
    dumpEl.hidden = false;
    dumpEl.focus(); dumpEl.select();
  });

  function drawKnobs(){
    const x = 8, y0 = 44, lh = 13;
    dbgCtx.fillStyle = "#F5F5F5";
    dbgCtx.fillRect(0, y0 - 10, 260, lh * KNOBS.length + 6);
    dbgCtx.font = "10px monospace";
    KNOBS.forEach(([k, , , what], i) => {
      dbgCtx.fillStyle = "#010101";
      dbgCtx.globalAlpha = i === knob ? 1 : 0.55;
      dbgCtx.fillText((i === knob ? "> " : "  ") + ((i + 1) % 10) + " " + k.padEnd(7) + T[k].toFixed(2) + "  " + what, x, y0 + i * lh);
    });
    dbgCtx.globalAlpha = 1;
  }

  function senseIdle(){
    if (!tune && !document.body.classList.contains("cam")) return;
    if (camEl.readyState >= 2) {
      dbgCtx.save();
      dbgCtx.setTransform(-1, 0, 0, 1, DW, 0);
      dbgCtx.drawImage(camEl, 0, 0, DW, DH);
      dbgCtx.restore();
      dbgCtx.fillStyle = "#F5F5F5";
      dbgCtx.fillRect(0, 0, DW, 40);
    } else {
      dbgCtx.fillStyle = "#F5F5F5";
      dbgCtx.fillRect(0, 0, DW, DH);
    }
    dbgCtx.fillStyle = "#010101";
    dbgCtx.font = "11px monospace";
    const words = String(Sense.note).split(" ");
    let line = "", y = 20;
    for (const w of words) {
      const next = line ? line + " " + w : w;
      if (dbgCtx.measureText(next).width > DW - 16 && line) {
        dbgCtx.fillText(line, 8, y); y += 14; line = w;
      } else line = next;
    }
    if (line) dbgCtx.fillText(line, 8, y);

    dbgCtx.fillStyle = "#F5F5F5";
    dbgCtx.fillRect(0, DH - 16, DW, 16);
    dbgCtx.fillStyle = "#010101";
    dbgCtx.fillText(
      "hold " + S.hold.toFixed(2) + "  size " + S.size.toFixed(2) +
      "", 5, DH - 5);
    drawKnobs();
  }

  function sense(sec){
    if (!landmarker || camEl.readyState < 2) return;

    // detectForVideo wants one call per decoded frame and a rising clock
    // The camera runs at 30fps and the field at whatever it can manage.
    // Repainting the preview on frames the camera has not advanced is
    // work for a picture that cannot have changed.
    if (camEl.currentTime === Sense.lastFrame) return;
    Sense.lastFrame = camEl.currentTime;

    let result;
    try {
      result = landmarker.detectForVideo(camEl, performance.now());
    } catch (err) { return; }

    const found = result.landmarks.map((lm, i) => {
      const label = result.handedness[i] && result.handedness[i][0]
        ? result.handedness[i][0].categoryName : "Right";
      return { lm, label, mx: 1 - lm[9].x };   // mirrored screen x
    });
    if (found.length >= 2) {
      found.sort((a, b) => b.mx - a.mx);
      found.forEach((h, i) => { h.side = i === 0 ? "R" : "L"; });
    } else {
      // a raised right hand rests right of centre; HAND_CENTER_X is where
      for (const h of found) h.side = h.mx >= HAND_CENTER_X - 0.10 ? "R" : "L";
    }
    if (handSwap) for (const h of found) h.side = h.side === "R" ? "L" : "R";
    Sense.hands = found;

    const right = found.find(h => h.side === "R");
    const left  = found.find(h => h.side === "L");

    const k = 1 - Math.pow(0.02, sec);
    const kp = 1 - Math.pow(0.05, sec);

    // the right hand does the gathering and carries the position
    if (right) {
      const target = gripOf(right.lm);
      Sense.grip += (target - Sense.grip) * k;

      const c = right.lm[9];
      const sx = 1 - c.x, sy = c.y;        // mirrored, so right means right
      if (Sense.seen) {
        const speed = Math.hypot(sx - Sense.lastX, sy - Sense.lastY) / Math.max(sec, 1e-3);
        Sense.energy = Math.min(1, Sense.energy * 0.82 + speed * 0.35);
      }
      Sense.lastX = sx; Sense.lastY = sy; Sense.seen = true;
      Sense.x += (sx - Sense.x) * k;
      Sense.y += (sy - Sense.y) * k;
    } else {
      Sense.grip += (0 - Sense.grip) * k;
      Sense.energy *= Math.pow(0.2, sec);
      Sense.seen = false;
    }

    // the left hand only sets the size, and holds it when it drops out
    if (left) {
      const target = pinchOf(left.lm);
      Sense.pinch += (target - Sense.pinch) * k;
    }

    // Wrist roll, off the knuckle line from index MCP to pinky MCP.
    // Either hand can do it: turning a wrist away from where it has been
    // resting, then back, steps to the next hold. Measured against that
    // rest angle because a hand held up already sits at a quarter turn,
    // so an absolute angle never returns to neutral and never re-arms.
    for (const h of found) {
      if (h.side !== "L") continue;
      const r = Sense.rolls[h.side] || (Sense.rolls[h.side] = { rest:null, now:0, armed:true });
      // Which side of the index finger the thumb tip is on. The index
      // runs from its knuckle (5) to its tip (8); the cross product says
      // left or right of that line, and crossing over flips the sign.
      const a = h.lm[5], b = h.lm[8], t = h.lm[4];
      const ix = b.x - a.x, iy = b.y - a.y;
      const len = Math.hypot(ix, iy) || 1e-5;
      const sideOf = ((t.x - a.x) * iy - (t.y - a.y) * ix) / len / handWidth(h.lm);

      if (r.rest === null) r.now = sideOf;
      r.now += (sideOf - r.now) * k;
      Sense.twist = r.now;
      r.rest = 0;   // kept so the hand-left cleanup below still applies

      // a clear crossing, not a thumb resting against the finger
      if (r.now > 0.10) r.armed = true;                 // thumb back on its own side
      else if (r.armed && r.now < -0.10) {
        r.armed = false;                                // crossed over: next hold
        if (!S.fixed) rollSeed();
      }
    }
    // a hand that leaves takes its rest angle with it
    for (const side of ["L", "R"]) if (!found.some(h => h.side === side)) delete Sense.rolls[side];

    Sense.present += ((found.length ? 1 : 0) - Sense.present) * kp;
    drawTune();
  }

  const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                 [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

  function drawTune(){

    dbgCtx.save();
    dbgCtx.setTransform(-1, 0, 0, 1, DW, 0);
    dbgCtx.drawImage(camEl, 0, 0, DW, DH);
    dbgCtx.restore();

    for (const h of Sense.hands) {
      const P = i => [(1 - h.lm[i].x) * DW, h.lm[i].y * DH];
      if (h.side === "R") {
        // the gathering hand: its joints as points
        dbgCtx.fillStyle = "#010101";
        for (const i of [4, 8, 12, 16, 20]) {
          const p = P(i);
          dbgCtx.beginPath(); dbgCtx.arc(p[0], p[1], 2.2, 0, 6.2832); dbgCtx.fill();
        }
      } else {
        // the sizing hand: thumb tip to index tip, and the span between
        const a = P(4), b = P(8);
        dbgCtx.strokeStyle = "#CBD7D4"; dbgCtx.lineWidth = 1.5;
        dbgCtx.beginPath(); dbgCtx.moveTo(a[0], a[1]); dbgCtx.lineTo(b[0], b[1]); dbgCtx.stroke();
        dbgCtx.fillStyle = "#CBD7D4";
        for (const p of [a, b]) { dbgCtx.beginPath(); dbgCtx.arc(p[0], p[1], 3.5, 0, 6.2832); dbgCtx.fill(); }
      }
    }

    if (!tune) return;
    dbgCtx.fillStyle = "#F5F5F5";
    dbgCtx.fillRect(0, DH - 16, DW, 16);
    dbgCtx.fillStyle = "#010101";
    dbgCtx.font = "11px monospace";
    dbgCtx.fillText(
      "grip " + Sense.grip.toFixed(2) + "  pinch " + Sense.pinch.toFixed(2) +
      "  twist " + Sense.twist.toFixed(2) + "  " + Sense.hands.map(h => h.side + h.label[0]).join(" ") +
      "", 5, DH - 5);
    drawKnobs();
  }

  // ---- capture, note, wall ------------------------------------------
  // Still for STILL_AFTER and the form sets. That frame is copied off the
  // WebGL canvas in the same tick it was drawn, square, so the wall is
  // images however many there are — the live march only ever renders one.

  const guideEl  = document.getElementById("guide");
  const frameEl  = document.getElementById("frame");
  const countEl  = document.getElementById("count");

  // the same square bake() takes, in css pixels
  function frameSide(){ return Math.min(cssW, cssH) * CROP; }
  const wallEl   = document.getElementById("wall");
  const noteEl   = document.getElementById("note");
  const noteName = document.getElementById("noteName");
  const noteText = document.getElementById("noteText");
  const retakeEl = document.getElementById("retake");
  const archiveEl = document.getElementById("archive");
  const toWallEl = document.getElementById("toWall");

  // the wall is a place you can look at any time, not only after saving
  function leaveWall(){
    freshId = null;
    document.body.classList.remove("wall", "detail");
    toWallEl.textContent = "WALL";
    renderWall();
    S.lastInput = performance.now();
  }

  function enterWall(){
    document.body.classList.add("wall");
    toWallEl.textContent = "BACK";
    wallIdleAt = performance.now() + WALL_IDLE_FOR;
  }


  // anything the visitor does on the wall keeps it open
  for (const ev of ["pointermove", "pointerdown", "keydown", "wheel"]) {
    addEventListener(ev, () => { wallIdleAt = performance.now() + WALL_IDLE_FOR; }, { passive:true });
  }

  toWallEl.addEventListener("click", () => {
    if (document.body.classList.contains("wall")) { leaveWall(); return; }
    enterWall();
  });

  // bumped to leave every earlier record behind: the crop changed, so
  // the old squares no longer match what is being saved now
  const WALL_KEY = "grit-wall-2";
  const pageNumEl = document.getElementById("pageNum");
  const prevEl    = document.getElementById("prevPage");
  const nextEl    = document.getElementById("nextPage");

  prevEl.addEventListener("click", () => { page--; renderWall(); });
  nextEl.addEventListener("click", () => { page++; renderWall(); });
  addEventListener("resize", () => { if (wall.length) renderWall(); });

  const DOT      = 96;          // matches --dot in the stylesheet
  let page = 0;

  // one wall is whatever fits on this screen. Resizing changes it, which
  // is fine: the walls are a way to page through, not a fixed layout.
  function perPage(){
    const cols = Math.max(1, Math.floor((innerWidth - DOT) / DOT));
    const rows = Math.max(1, Math.floor((innerHeight - DOT) / DOT));
    return cols * rows;
  }
  const BAKE     = 360;         // px, square

  const API = "/api/holds";
  let remote = false;          // set once the server answers
  let wall = [];

  if (QS.has("clear")) { try { localStorage.removeItem(WALL_KEY); } catch (e) {} }
  else { try { wall = JSON.parse(localStorage.getItem(WALL_KEY) || "[]"); } catch (e) { wall = []; } }

  // ask the server; if it is there its wall replaces the local one
  fetch(API, { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || !Array.isArray(d.holds)) return;
      remote = true;
      wall = d.holds.map(h => ({ ...h, img: h.url }));
      renderWall();
    })
    .catch(() => {});
  let bakePending = false, noteT = 0, lastGuide = null, lastCount = null;
  let freshId = null, wallIdleAt = 0;

  function saveWall(){
    if (remote) return;        // the server holds it, and object urls do not survive a reload
    try { localStorage.setItem(WALL_KEY, JSON.stringify(wall)); }
    catch (e) { console.warn("wall not saved:", e.name); }
  }

  // The visitor never waits on the network: the hold goes up straight
  // away, and the request catches up. A failed send leaves it on screen
  // for this session and is reported, not swallowed.
  function sendHold(entry){
    if (!remote) return Promise.resolve();
    const q = new URLSearchParams({ name: entry.name, note: entry.note, hold: entry.hold });
    return fetch(API + "?" + q, {
      method: "POST",
      headers: { "content-type": "image/png" },
      body: entry.blob
    })
      .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
      .then(d => {
        if (d.entry && d.entry.url) entry.img = d.entry.url;
        delete entry.blob;
      });
  }

  // only the latest page is up. Earlier pages are kept, not shown yet.
  function pageCount(){ return Math.max(1, Math.ceil(wall.length / perPage())); }

  function renderWall(){
    const per = perPage();
    page = Math.max(0, Math.min(page, pageCount() - 1));
    const start = page * per;
    pageNumEl.textContent = String(page + 1);
    prevEl.disabled = page === 0;
    nextEl.disabled = page >= pageCount() - 1;
    wallEl.replaceChildren(...wall.slice(start, start + per).map(en => {
      const f  = document.createElement("figure");
      const im = new Image(); im.src = en.img; im.alt = "";
      f.dataset.id = String(en.id);
      if (en.id === freshId) f.className = "fresh";
      f.append(im);
      return f;
    }));
  }
  renderWall();

  const detailEl  = document.getElementById("detail");
  const detailImg = document.getElementById("detailImg");
  const detailTxt = document.getElementById("detailText");

  wallEl.addEventListener("click", e => {
    const f = e.target.closest("figure");
    if (!f) return;
    const en = wall.find(h => String(h.id) === f.dataset.id);
    if (!en) return;
    detailImg.src = en.img;
    detailTxt.replaceChildren();
    for (const [cls, text] of [["who", en.name], ["what", en.note]]) {
      if (!text) continue;
      const d = document.createElement("div");
      d.className = cls; d.textContent = text;
      detailTxt.append(d);
    }
    document.body.classList.add("detail");
  });

  detailEl.addEventListener("click", () => document.body.classList.remove("detail"));

  function bake(){
    const side = Math.min(canvas.width, canvas.height) * CROP;
    const sx = (canvas.width - side) / 2, sy = (canvas.height - side) / 2;
    const c = document.createElement("canvas");
    c.width = BAKE; c.height = BAKE;
    const cx = c.getContext("2d");
    cx.drawImage(canvas, sx, sy, side, side, 0, 0, BAKE, BAKE);

    // Turn the paper into transparency. Alpha is how far a pixel sits
    // below GRIT WHITE, and the colour is un-composited from it, so
    // laying this back on GRIT WHITE reproduces the frame exactly while
    // it leaves no square behind on the grid.
    const P = 245;
    const im = cx.getImageData(0, 0, BAKE, BAKE), d = im.data;
    for (let i = 0; i < d.length; i += 4) {
      const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const a = Math.min(1, Math.max(0, (P - lum) / P));
      if (a < 0.004) { d[i + 3] = 0; continue; }
      for (let k = 0; k < 3; k++) {
        d[i + k] = Math.min(255, Math.max(0, Math.round((d[i + k] - P * (1 - a)) / a)));
      }
      d[i + 3] = Math.round(a * 255);
    }
    cx.putImageData(im, 0, 0);

    // toBlob encodes off the main thread, so the field keeps running
    return new Promise(resolve => c.toBlob(b => resolve(b), "image/png"));
  }

  function fix(){
    S.fixed = true; S.phase = "NOTE";
    bakePending = true;
  }

  function openNote(){
    noteName.value = ""; noteText.value = "";
    noteEl.hidden = false;
    noteName.focus();
    noteT = 0;
  }

  // Enter in the first field moves on; Enter in the second commits
  noteName.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); noteText.focus(); }
  });
  noteEl.addEventListener("submit", e => { e.preventDefault(); commit(); });
  noteEl.addEventListener("input", () => { noteT = 0; S.lastInput = performance.now(); });

  // back to making, keeping nothing: same hold, same size, still loose
  function retake(){
    noteEl.hidden = true;
    noteName.blur(); noteText.blur();
    S.fixed = false; S.settleT = 0; S.stillT = 0; S.phase = "MAKE"; S.baked = null;
    S.down = 0; S.armed = false;
    S.lastInput = performance.now();
  }
  retakeEl.addEventListener("click", retake);

  // a blob url dies with the page, so the local fallback needs the bytes
  function toDataURL(blob){
    return new Promise(resolve => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.readAsDataURL(blob);
    });
  }

  function commit(){
    // the picture has to exist before the entry that points at it
    archiveEl.disabled = true;
    archiveEl.textContent = "SAVING";
    Promise.resolve(S.bakeReady).then(finishCommit);
  }

  function finishCommit(){
    wall.push({
      id: Date.now(),
      name: noteName.value.trim(),
      note: noteText.value.trim(),
      hold: HOLD_NAMES[S.form[0]], form: S.form.slice(), size: S.size,
      img: S.bakedUrl, blob: S.baked
    });
    const added = wall[wall.length - 1];
    freshId = added.id;
    page = Math.ceil(wall.length / perPage()) - 1;

    sendHold(added)
      .then(() => {
        if (!remote && added.blob) {
          toDataURL(added.blob).then(u => { added.img = u; delete added.blob; saveWall(); renderWall(); });
        }
        saveWall(); renderWall();
        noteEl.hidden = true;
        archiveEl.disabled = false; archiveEl.textContent = "ARCHIVE";
        enterWall();
      })
      .catch(err => {
        console.error("wall unreachable, kept on this machine:", err);
        // it goes up either way; only where it is kept changes
        const wasRemote = remote;
        remote = false;
        if (added.blob) {
          toDataURL(added.blob).then(u => { added.img = u; delete added.blob; saveWall(); renderWall(); });
        }
        saveWall(); renderWall();
        remote = wasRemote;
        noteEl.hidden = true;
        archiveEl.disabled = false; archiveEl.textContent = "ARCHIVE";
        guideEl.textContent = "SAVED ON THIS SCREEN ONLY";
        lastGuide = null;
        enterWall();
      });
    noteName.blur(); noteText.blur();

    // RESET — the field lets go; the next visitor gets a fresh hold
    S.fixed = false; S.settleT = 0; S.stillT = 0; S.phase = "MAKE"; S.baked = null;
    S.down = 0; S.armed = false;
    rollSeed();
  }

  function resetAll(){
    S.tprox = S.tcontact = 0;
    S.tnx = S.tny = 0;
    S.residue = 0; S.energy = 0; S.seen = false; S.down = 0;
    if (EXHIBITION) document.body.classList.add("dim");
  }

  // ---- sizing ------------------------------------------------------
  let scale = 1.0, cssW = 1, cssH = 1;
  function applySize(){
    const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    cssW = canvas.clientWidth; cssH = canvas.clientHeight;
    const w = Math.max(1, Math.floor(cssW * dpr * scale));
    const h = Math.max(1, Math.floor(cssH * dpr * scale));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }
  new ResizeObserver(applySize).observe(canvas);
  applySize();
  S.px = S.tpx = S.ax = cssW / 2;
  S.py = S.tpy = S.ay = cssH / 2;

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.GRIT = { S, Sense, frames: 0 };

  // ---- loop --------------------------------------------------------
  let raf = 0, t0 = performance.now(), prev = t0, avgDt = 16.7;

  function tick(now){
    GRIT.frames++;
    const dt = Math.min(64, now - prev); prev = now;
    const sec = dt / 1000;

    if (Sense.on) {
      sense(sec);

      // the camera keeps reading — the overlay stays live — but nothing
      // it sees reaches the field once the hold has been taken
      if (S.fixed) { S.lastInput = now; }
      else {

      // a hand in frame is the approach. Closing it is the hold —
      // there is no button, the fist is the button.
      S.tprox    = Sense.present;
      S.tcontact = Sense.grip;
      S.down     = Sense.grip;

      if (DEV_SIZE !== null) Sense.pinch = DEV_SIZE;
      S.tnx = Math.max(-1, Math.min(1, (Sense.x - HAND_CENTER_X) * 2.4));
      S.tny = Math.max(-1, Math.min(1, (Sense.y - HAND_CENTER_Y) * 2.4));
      S.tpx = Sense.x * cssW;
      S.tpy = (1 - Sense.y) * cssH;   // the shader wants y up
      S.energy = Sense.energy;

      // the left hand keeps its last size when it leaves the frame
      S.size += (Sense.pinch - S.size) * (1 - Math.pow(0.05, sec));

      if (Sense.grip > 0.5) {
        S.ax = S.tpx; S.ay = S.tpy;
        S.residue = Math.max(S.residue, 0.85);
      }
      if (Sense.present > 0.02) S.lastInput = now;
      }
    } else {
      senseIdle();
    }


    if (!S.fixed) {
    if (S.prox < 0.02) S.armed = true;
    else if (S.armed && S.prox > 0.05 && S.hold < 0.05) { rollSeed(); S.armed = false; }
    }

    if (DEV_FIX) {
      S.down = 1; S.hold = 1; S.lastInput = now;
      if (DEV_SIZE !== null) S.size = DEV_SIZE;
      S.tprox = S.prox = 1; S.tcontact = S.contact = 1;
      S.tnx = S.nx = 0; S.tny = S.ny = 0;
    }

    if (S.fixed) S.down = 1;              // set. Nothing the hand does now changes it

    // gathered and not moving for STILL_AFTER: that is the decision
    const moving = (Sense.on ? Sense.energy : S.energy) > 0.08;
    if (!S.fixed) {
      // anything the visitor can still change about the hold restarts it
      const changed =
        Math.abs(S.hold - S.wasHold) > 0.02 ||
        Math.abs(S.size - S.wasSize) > 0.015 ||
        S.form[0] !== S.wasForm;
      S.wasHold = S.hold; S.wasSize = S.size; S.wasForm = S.form[0];

      const held = S.hold > 0.9 && !moving && !changed;
      // two seconds of stillness first, then the three-second count
      S.settleT = held ? S.settleT + sec : 0;
      S.stillT  = (held && S.settleT >= SETTLE_AFTER) ? S.stillT + sec : 0;
      if (S.stillT >= STILL_AFTER) fix();
    } else if (S.phase === "NOTE") {
      noteT += sec;
      if (noteT > NOTE_AFTER) commit();
    }

    // one line of guidance. Pointer mode only gets the lines that apply.
    let g = "";
    if (S.phase === "NOTE") g = "NAME  ·  NOTE";
    else if (Sense.on && Sense.present < 0.05) g = "RAISE YOUR RIGHT HAND";
    else if (Sense.on && S.hold < 0.5) g = "RIGHT HAND — GRIP TO GATHER  ·  RELEASE TO SCATTER";
    else if (Sense.on) g = "LEFT HAND — PINCH TO RESIZE  ·  TWIST TO CHANGE\nRIGHT HAND — RELEASE TO SCATTER";
    if (g !== lastGuide) { guideEl.textContent = g; lastGuide = g; }

    // the crop appears with the count and firms up as it closes
    {
      const counting = S.stillT > 0.05 || S.fixed;
      const easing   = S.settleT > 1.0;          // still, but not counting yet
      const t = S.fixed ? 1 : Math.min(1, S.stillT / STILL_AFTER);
      const show = (counting || easing) && S.phase !== "NOTE";
      const side = frameSide();
      frameEl.style.width = side + "px";
      frameEl.style.height = side + "px";
      frameEl.style.opacity = !show ? 0 : counting ? (0.22 + t * 0.4).toFixed(3) : "0.14";
      const c = S.fixed ? "" : String(Math.max(1, Math.ceil(STILL_AFTER - S.stillT)));
      if (c !== lastCount) { countEl.textContent = c; lastCount = c; }
    }

    // the wall lets go by itself, but only once nobody has touched it
    if (document.body.classList.contains("wall")) {
      if (now > wallIdleAt) leaveWall();
    } else {
      wallIdleAt = now + WALL_IDLE_FOR;
    }

    if (now - S.lastInput > RESET_AFTER) resetAll();

    const k  = 1 - Math.pow(0.001, sec);
    const ks = 1 - Math.pow(1e-7, sec);
    S.nx += (S.tnx - S.nx) * k;
    S.ny += (S.tny - S.ny) * k;
    S.px += (S.tpx - S.px) * k;
    S.py += (S.tpy - S.py) * k;
    S.prox    += (S.tprox    - S.prox)    * k;
    S.contact += (S.tcontact - S.contact) * ks;
    if (!Sense.on) S.energy *= Math.pow(0.12, sec);

    // asymmetric: ~1s to gather, ~0.6s to break apart again
    S.hold += (S.down - S.hold) * (1 - Math.pow(S.down > S.hold ? 0.07 : 0.004, sec));

    // the field's own clock slows as it settles, so the churn winds down
    // instead of being cut off
    ftime += sec * (reduceMotion ? 0.3 : 1) * (1.0 - 0.93 * S.hold) * (S.fixed ? 0 : 1);
    const t = ftime;

    if (S.tcontact < 0.5) S.residue = Math.max(0, S.residue - RESIDUE_DECAY * sec);

    const idleX = reduceMotion ? 0 : Math.sin(t * 0.17) * 0.20;
    const idleY = reduceMotion ? 0 : Math.cos(t * 0.12) * 0.10;
    const rx = idleX * (1 - S.prox) + (S.nx *  0.62) * S.prox;
    const ry = idleY * (1 - S.prox) + (S.ny * -0.38) * S.prox;

    const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    const rs = dpr * scale;

    gl.uniform3f(uRes, canvas.width, canvas.height, dpr);
    gl.uniform1f(uTime, t);
    gl.uniform2f(uRot, rx, ry);
    gl.uniform2f(uPointPx, S.px * rs, S.py * rs);
    gl.uniform2f(uAnchorPx, S.ax * rs, S.ay * rs);
    gl.uniform1f(uProx, S.prox);
    gl.uniform1f(uContact, S.contact);
    gl.uniform1f(uResidue, S.residue);
    gl.uniform1f(uEnergy, S.energy);
    gl.uniform1f(uHold, S.hold);
    gl.uniform3f(uSeed, S.seed[0], S.seed[1], S.seed[2]);
    gl.uniform4f(uSeed2, S.seed2[0], S.seed2[1], S.seed2[2], S.seed2[3]);
    gl.uniform4f(uForm, S.form[0], S.form[1], S.form[2], S.form[3]);
    gl.uniform1f(uFit, 1 / HOLD_MAXR[S.form[0]]);
    gl.uniform4f(uTuneC, T.relief, T.dome, T.zoom, 0);
    gl.uniform1f(uSize, S.size);
    T = tuneFor(S.form[0]);
    gl.uniform4f(uTuneA, T.expo, T.foldLo, T.foldHi, T.agit);
    gl.uniform4f(uTuneB, T.radius, T.py, T.pz, 0);

    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    if (bakePending) {
      bakePending = false;
      // the crop has to be read in the same tick it was drawn
      S.bakeReady = bake().then(blob => {
        S.baked = blob;
        S.bakedUrl = URL.createObjectURL(blob);
      });
      openNote();
    }

    let label = "IDLE";
    if (S.contact > 0.4)       label = "CONTACT";
    else if (S.prox > 0.12)    label = "PROXIMITY";
    else if (S.residue > 0.02) label = "RESIDUE";
    if (label !== S.label && stateEl) { stateEl.textContent = label; S.label = label; }

    // 100 raymarch steps is heavy on integrated GPUs
    avgDt += (dt - avgDt) * 0.05;
    if (avgDt > 26 && scale > 0.55)     { scale -= 0.06; applySize(); }
    else if (avgDt < 15 && scale < 1.0) { scale = Math.min(1, scale + 0.03); applySize(); }

    // ?wall opens straight onto what has been kept. Last, so every
  // piece of state it touches already exists.
  if (QS.has("wall")) enterWall();

  raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else { prev = performance.now(); raf = requestAnimationFrame(tick); }
  });
}
</script>
</body>
</html>
